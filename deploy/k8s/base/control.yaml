apiVersion: v1
kind: Service
metadata:
  name: control
spec:
  selector:
    app.kubernetes.io/name: control
  ports:
    - name: http
      port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: control
  template:
    metadata:
      labels:
        app.kubernetes.io/name: control
    spec:
      containers:
        - name: control
          image: ghcr.io/your-org/astra-cdn-control:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: astra-cdn-config
            - secretRef:
                name: astra-cdn-secrets
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
