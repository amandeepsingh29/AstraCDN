apiVersion: v1
kind: Service
metadata:
  name: edge
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: edge
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: edge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edge
    spec:
      containers:
        - name: edge
          image: ghcr.io/your-org/astra-cdn-edge:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: astra-cdn-config
            - secretRef:
                name: astra-cdn-secrets
          env:
            - name: EDGE_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CONTROL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: astra-cdn-secrets
                  key: ASTRACDN_API_KEY
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
