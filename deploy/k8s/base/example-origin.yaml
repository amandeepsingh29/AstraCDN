apiVersion: v1
kind: Service
metadata:
  name: example-origin
spec:
  selector:
    app.kubernetes.io/name: example-origin
  ports:
    - name: http
      port: 9000
      targetPort: 9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-origin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: example-origin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: example-origin
    spec:
      containers:
        - name: origin
          image: ghcr.io/your-org/astra-cdn-origin:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9000
          env:
            - name: ORIGIN_PORT
              value: "9000"
            - name: ORIGIN_STORAGE_MODE
              valueFrom:
                configMapKeyRef:
                  name: astra-cdn-config
                  key: ORIGIN_STORAGE_MODE
            - name: ORIGIN_ASSET_DIR
              valueFrom:
                configMapKeyRef:
                  name: astra-cdn-config
                  key: ORIGIN_ASSET_DIR
            - name: ORIGIN_S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: astra-cdn-config
                  key: ORIGIN_S3_ENDPOINT
            - name: ORIGIN_S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: astra-cdn-config
                  key: ORIGIN_S3_BUCKET
            - name: ORIGIN_S3_REGION
              valueFrom:
                configMapKeyRef:
                  name: astra-cdn-config
                  key: ORIGIN_S3_REGION
            - name: ORIGIN_S3_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: astra-cdn-config
                  key: ORIGIN_S3_PREFIX
            - name: ORIGIN_S3_FORCE_PATH_STYLE
              valueFrom:
                configMapKeyRef:
                  name: astra-cdn-config
                  key: ORIGIN_S3_FORCE_PATH_STYLE
            - name: ORIGIN_S3_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: astra-cdn-config
                  key: ORIGIN_S3_TIMEOUT
            - name: ORIGIN_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: astra-cdn-secrets
                  key: ORIGIN_S3_ACCESS_KEY_ID
                  optional: true
            - name: ORIGIN_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: astra-cdn-secrets
                  key: ORIGIN_S3_SECRET_ACCESS_KEY
                  optional: true
            - name: ORIGIN_S3_SESSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: astra-cdn-secrets
                  key: ORIGIN_S3_SESSION_TOKEN
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: origin-assets
              mountPath: /var/lib/astra-cdn/origin
              readOnly: true
      volumes:
        - name: origin-assets
          persistentVolumeClaim:
            claimName: origin-assets
